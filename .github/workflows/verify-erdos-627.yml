name: Verify Erdos 627 Tutte-Zykov proof
on:
  push:
    branches: [codex/erdos-627-verify]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get pinned Mathlib cache
        run: lake exe cache get
      - name: Build complete proof module with warnings as errors
        run: |
          set -o pipefail
          lake --wfail build FormalConjecturesForMathlib.Combinatorics.SimpleGraph.Mycielski 2>&1 | tee proof-build.log
      - name: Extract exact submitted theorem
        run: python .github/erdos627-audit.py
      - name: Check exact theorem and all principal axioms
        run: |
          set -o pipefail
          lake env lean -DwarningAsError=true ExactTargetAudit.lean 2>&1 | tee axioms.log
          python .github/erdos627-audit.py --check-log
      - name: Build shared library and actual problem module with warnings as errors
        run: |
          set -o pipefail
          lake --wfail build FormalConjecturesForMathlib 'FormalConjectures.ErdosProblems.«627»' 2>&1 | tee integration-build.log
      - name: Inspect axioms imported from the actual problem module
        run: |
          set -o pipefail
          lake env lean -DwarningAsError=true ActualModuleAudit.lean 2>&1 | tee actual-axioms.log
          python .github/erdos627-audit.py --check-log --log actual-axioms.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos627-verification
          path: |
            proof-build.log
            axioms.log
            ExactTargetAudit.lean
            audit-manifest.json
            integration-build.log
            actual-axioms.log
            ActualModuleAudit.lean
          if-no-files-found: error
