name: Isolated external-to-FC verification for Erdős 515
on:
  push:
    branches: [codex/erdos-515-proof-audit]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl --fail --silent --show-error --location https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          tar xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Rebuild pinned proof and verify the exact FC declaration
        run: python3 audit-515/isolated.py
      - name: Upload isolated verification sources and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erdos-515-isolated-verification
          path: isolated-logs/
